[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harbormasterd"
version = "1.0.1"
description = "Zero-conflict port management with automatic HTTPS and DNS for local development"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jordan Newell", email = "58616955+JordanNewell@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
keywords = ["port", "development", "local-dev", "dns", "tls", "https"]
requires-python = ">=3.9"

dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.1",
    "keyring>=24.2.0",
    "colorama>=0.4.6",
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.24.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/JordanNewell/harbormasterd"
Documentation = "https://github.com/JordanNewell/harbormasterd#readme"
Repository = "https://github.com/JordanNewell/harbormasterd"
Issues = "https://github.com/JordanNewell/harbormasterd/issues"

[project.scripts]
pa = "pa:main"
pa-platform = "pa_platform:main"
pad = "pad:main"

[tool.setuptools]
py-modules = ["pa", "pa_platform", "pad", "token_store", "dns_resolver", "tls_manager"]
packages = ["data", "drivers"]
include-package-data = true

[tool.setuptools.package-data]
data = ["*.yaml"]
drivers = ["*.py"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
